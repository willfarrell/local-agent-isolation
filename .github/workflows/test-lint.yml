name: Tests (lint)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: "hadolint: Dockerfile lint"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            github.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true

  launchers:
    name: "Launchers: zsh and PowerShell parse"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            github.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pwsh ships on the ubuntu runners.
      - name: agents.ps1
        run: |
          # shellcheck disable=SC2016 # PowerShell source: pwsh expands the $, not the shell
          pwsh -NoProfile -c '$e=$null; [System.Management.Automation.Language.Parser]::ParseFile("agents.ps1",[ref]$null,[ref]$e)|Out-Null; if($e){$e; exit 1}'
      # zsh is not on the runner, and apt is outside the egress allow-list, so
      # parse in the repo's pinned alpine base.
      - name: agents.zsh
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w \
            alpine:3.24@sha256:c6b073f8e9e58d881f6ffba6ebf3b9ebd60b9e7d6e8337018c0e68bb5c356873 \
            sh -c 'apk add --no-cache zsh=5.9-r7 >/dev/null && zsh -n agents.zsh'
      # Both launchers must start the same harness images.
      - name: Same harness list in both
        run: |
          zsh=$(sed -n 's/^AGENTS_HARNESSES=(\(.*\))$/\1/p' agents.zsh)
          ps1=$(sed -n "s/^\$AgentsHarnesses = @(\(.*\))$/\1/p" agents.ps1 | tr -d "',")
          test -n "$zsh" && test "$zsh" = "$ps1" \
            || { echo "::error::AGENTS_HARNESSES differs: zsh '$zsh', ps1 '$ps1'"; exit 1; }
