name: Tests (sast)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 3 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # https://github.com/aquasecurity/trivy-action
  trivy-config:
    name: "Trivy: Dockerfile misconfiguration"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            check.trivy.dev:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          hide-progress: true
          exit-code: 1

  trivy-sca:
    name: "Images: tests, DAST, Trivy SCA and licensing"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          # The release build's list, plus Kiro's CDN (built here, never released),
          # Trivy's binary and databases, and upload-artifact's results service.
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            *.blob.core.windows.net:443
            check.trivy.dev:443
            codeload.github.com:443
            desktop-release.q.us-east-1.amazonaws.com:443
            dl-cdn.alpinelinux.org:443
            docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com:443
            files.pythonhosted.org:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            mirror.gcr.io:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The launchers' AGENTS_HARNESSES, harness-kiro included: CI builds it
      # locally and never pushes it. herdr is last in that list.
      - name: Harness list
        id: harnesses
        run: echo "list=$(sed -n 's/^AGENTS_HARNESSES=(\(.*\))$/\1/p' agents.zsh)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          HARNESSES: ${{ steps.harnesses.outputs.list }}
        run: |
          # shellcheck disable=SC2086 # the list splits into bake targets
          docker buildx bake -f docker-build.hcl $HARNESSES paperclip local-system-1 local-system-2 --load
      # With the launcher's flags (AGENTS_HARDENING in agents.zsh), so this is how users run them.
      - name: Smoke and security tests
        env:
          HARNESSES: ${{ steps.harnesses.outputs.list }}
        run: |
          mkdir -p "$RUNNER_TEMP/agents"
          # shellcheck disable=SC2054 # the commas are --tmpfs mount options, not array separators
          hardening=(--user 1000:1000 --read-only --cap-drop ALL --security-opt no-new-privileges:true
            --pids-limit 4096 --ipc private --tmpfs /tmp:exec,nosuid,nodev)
          for image in $HARNESSES; do
            # docker-build.hcl tags the never-released kiro local/, not willfarrell/.
            ref=willfarrell/$image
            [ "$image" = harness-kiro ] && ref=local/$image
            docker run --rm "${hardening[@]}" --tmpfs /home:uid=1000,gid=1000,nosuid,nodev \
              -v "$RUNNER_TEMP/agents:/.agents:ro" "$ref" --version >/dev/null \
              || { echo "::error::$image does not start"; exit 1; }
          done
          # paperclip is herdr plus paperclip, so its copies of the harnesses must run too.
          run() {
            docker run --rm "${hardening[@]}" --tmpfs /home:uid=1000,gid=1000,nosuid,nodev \
              -v "$RUNNER_TEMP/agents:/.agents:ro" \
              --entrypoint /sbin/tini willfarrell/paperclip -- home-init "$@"
          }
          for bin in claude codex copilot gemini opencode pi hermes herdr gh aws az; do
            run "$bin" --version >/dev/null || { echo "::error::$bin does not start in paperclip"; exit 1; }
          done
          test "$(run id -u)" = 1000 || { echo "::error::not uid 1000"; exit 1; }
          suid=$(run sh -c 'find / -xdev -perm /6000 -type f 2>/dev/null || true')
          test -z "$suid" || { echo "::error::setuid/setgid files: $suid"; exit 1; }
          test "$(run readlink /home/.claude/settings.json)" = /.agents/settings.claude.json \
            || { echo "::error::settings.json is not linked to read-only /.agents"; exit 1; }
          # home-init with no login store (an orchestrator's kept home): a login and a file in a
          # kept session store ("dir/") survive the next start; an unlisted file and a symlink
          # planted in the home volume are gone.
          docker run --rm "${hardening[@]}" -v smoke-home:/home --entrypoint sh willfarrell/harness-claude-code \
            -c 'mkdir -p /home/.claude/rules /home/.claude/projects/x && touch /home/.claude/.credentials.json \
                  /home/.claude/settings.local.json /home/.claude/rules/x /home/.claude/projects/x/y.jsonl \
                && ln -s /tmp/rc /home/.bashrc'
          docker run --rm "${hardening[@]}" -v smoke-home:/home -v "$RUNNER_TEMP/agents:/.agents:ro" \
            --entrypoint /sbin/tini willfarrell/harness-claude-code -- home-init sh -c '
              test -f /home/.claude/.credentials.json || { echo "kept login removed"; exit 1; }
              test -f /home/.claude/projects/x/y.jsonl || { echo "kept session store lost"; exit 1; }
              test ! -L /home/.bashrc && test ! -e /home/.claude/settings.local.json && test ! -e /home/.claude/rules \
                || { echo "planted files left"; exit 1; }' \
            || { echo "::error::home-init keep list failed"; exit 1; }
          docker volume rm smoke-home >/dev/null
          # home-init with the read-only login store a harness run mounts: a login is copied in, a
          # symlink in the store is not followed, ~/.claude.json loses its env (applied to
          # process.env at launch), and a pi auth.json holding a shell command refuses the start.
          # herdr: it has both claude's and pi's logins.d.
          logins() {
            docker run --rm "${hardening[@]}" -v smoke-logins:/logins --entrypoint sh willfarrell/herdr -c "$1"
          }
          start() {
            docker run --rm "${hardening[@]}" --tmpfs /home:uid=1000,gid=1000,nosuid,nodev \
              -v smoke-logins:/logins:ro -v "$RUNNER_TEMP/agents:/.agents:ro" \
              --entrypoint /sbin/tini willfarrell/herdr -- home-init "$@"
          }
          logins 'mkdir -p /logins/.claude /logins/.codex \
            && echo "{\"userID\":\"u\",\"env\":{\"NODE_OPTIONS\":\"--require /tmp/x\"}}" > /logins/.claude.json \
            && echo tok > /logins/.claude/.credentials.json && ln -s /etc/hostname /logins/.codex/auth.json'
          start sh -c '
              grep -qx tok /home/.claude/.credentials.json || { echo "login not copied in"; exit 1; }
              test ! -e /home/.codex/auth.json && test ! -L /home/.codex/auth.json || { echo "symlink in the store followed"; exit 1; }
              jq -e ".userID == \"u\" and (has(\"env\") | not)" /home/.claude.json >/dev/null || { echo "claude.json env kept"; exit 1; }' \
            || { echo "::error::home-init login copy-in failed"; exit 1; }
          logins 'mkdir -p /logins/.pi/agent && echo "{\"p\":{\"type\":\"api_key\",\"key\":\"!touch /tmp/x\"}}" > /logins/.pi/agent/auth.json'
          if start true; then echo "::error::a pi auth.json holding a shell command was not refused"; exit 1; fi
          docker volume rm smoke-logins >/dev/null
          # agents-logins-save after a run: concurrent Claude runs void each other's refresh tokens, so a
          # login blanked by a failed refresh, or one expiring before the stored one, leaves the stored one.
          docker run --rm "${hardening[@]}" --network none --tmpfs /home:uid=1000,gid=1000,nosuid,nodev \
            --tmpfs /logins:uid=1000,gid=1000,nosuid,nodev --entrypoint sh willfarrell/harness-claude-code -c '
              cred() { mkdir -p /home/.claude && printf "{\"claudeAiOauth\":{\"refreshToken\":\"%s\",\"expiresAt\":%s}}" "$1" "$2" > /home/.claude/.credentials.json; }
              stored() { jq -r .claudeAiOauth.refreshToken /logins/.claude/.credentials.json; }
              cred r2 2000 && agents-logins-save /home /logins && test "$(stored)" = r2 || { echo "login not saved"; exit 1; }
              cred "" 0 && agents-logins-save /home /logins && test "$(stored)" = r2 || { echo "blanked login saved"; exit 1; }
              cred r1 1000 && agents-logins-save /home /logins && test "$(stored)" = r2 || { echo "older login saved"; exit 1; }
              cred r3 3000 && agents-logins-save /home /logins && test "$(stored)" = r3 || { echo "newer login not saved"; exit 1; }' \
            || { echo "::error::agents-logins-save Claude credentials check failed"; exit 1; }
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint ollama willfarrell/local-system-2 --version >/dev/null \
            || { echo "::error::local-system-2 does not start"; exit 1; }
          # Imports only: the weights are fetched at first start, not in CI.
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint python3 willfarrell/local-system-1 -c 'import numpy, onnxruntime, tokenizers' \
            || { echo "::error::local-system-1 does not start"; exit 1; }
      # DAST: paperclip as compose runs it, scanned by the ZAP baseline. -I: warnings
      # are reported, not fatal; only rules ZAP itself marks FAIL break the build.
      # compose needs a repo to mount (the launchers' AGENTS_WORKSPACE), so a throwaway one.
      - name: DAST (ZAP baseline, paperclip)
        env:
          AGENTS_WORKSPACE: ${{ runner.temp }}/ws
          AGENTS_WORKSPACE_IN: ${{ runner.temp }}/ws
          AGENTS_WORKSPACE_KEY: ci
        run: |
          git init -q "$AGENTS_WORKSPACE"
          mkdir -p "$AGENTS_WORKSPACE/.git/hooks" "$HOME/.agents" "$RUNNER_TEMP/zap"
          chmod 777 "$RUNNER_TEMP/zap"
          docker compose -f compose.yaml up -d --wait --wait-timeout 300 paperclip
          curl -sf --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null http://127.0.0.1:3100/
          docker build -q -t zap .github/zap
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" zap \
            zap-baseline.py -t http://127.0.0.1:3100 -I -r zap-report.html
      - name: Paperclip logs
        if: failure()
        env:
          AGENTS_WORKSPACE: ${{ runner.temp }}/ws
          AGENTS_WORKSPACE_IN: ${{ runner.temp }}/ws
          AGENTS_WORKSPACE_KEY: ci
        run: docker compose -f compose.yaml logs paperclip paperclip-db
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: ${{ runner.temp }}/zap/zap-report.html
          retention-days: 14
          if-no-files-found: ignore
      # paperclip is herdr (every harness on tools) plus paperclip, so it and the local-system images cover every image.
      - name: Trivy (local-system-1)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: willfarrell/local-system-1:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          hide-progress: true
          exit-code: 1
      - name: Trivy (paperclip)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: willfarrell/paperclip:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          hide-progress: true
          exit-code: 1
      - name: Trivy (local-system-2)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: willfarrell/local-system-2:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          hide-progress: true
          exit-code: 1
      - name: Trivy licensing (paperclip)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: willfarrell/paperclip:latest
          scanners: license
          hide-progress: true
          exit-code: 0
          format: table
      - name: Trivy licensing (local-system-2)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: willfarrell/local-system-2:latest
          scanners: license
          hide-progress: true
          exit-code: 0
          format: table

  # https://github.com/github/codeql-action
  codeql:
    name: "CodeQL: SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: actions
          queries: +security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:actions"

  # https://semgrep.dev/docs/semgrep-ci/sample-ci-configs/#github-actions
  # A plain runner job, not `container:`, so harden-runner can wrap it.
  semgrep:
    name: "semgrep: SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            auth.docker.io:443
            github.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            semgrep.dev:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        run: |
          docker build -q -t semgrep .github/semgrep
          docker run --rm -v "$PWD:/src:ro" -w /src semgrep \
            semgrep scan --config p/dockerfile --error --metrics=off .

  # https://github.com/raven-actions/actionlint
  actionlint:
    name: "actionlint: GitHub Actions lint"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          pyflakes: false

  # https://github.com/zizmorcore/zizmor-action
  zizmor:
    name: "zizmor: GitHub Actions SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

  # https://github.com/trufflesecurity/trufflehog
  trufflehog:
    name: "TruffleHog: secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # audit: verification calls each secret's issuing provider, so egress is data-dependent.
          egress-policy: audit
          disable-sudo: true
          disable-telemetry: true
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --only-verified

  # https://github.com/gitleaks/gitleaks-action
  gitleaks:
    name: "gitleaks: secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            api.keygen.sh:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - name: Require GITLEAKS_LICENSE
        if: env.GITLEAKS_LICENSE == '' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
        run: |
          echo "::error::GITLEAKS_LICENSE secret is not set; gitleaks cannot run"
          exit 1
      - name: Checkout repository
        if: env.GITLEAKS_LICENSE != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
