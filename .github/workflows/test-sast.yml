name: Tests (sast)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 3 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # https://github.com/aquasecurity/trivy-action
  trivy-config:
    name: "Trivy: Dockerfile misconfiguration"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            check.trivy.dev:443
            get.trivy.dev:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          hide-progress: true
          exit-code: 1

  trivy-sca:
    name: "Images: tests, DAST, Trivy SCA and licensing"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # audit: builds reach docker hub, alpine, npm, PyPI and GitHub release CDNs.
          egress-policy: audit
          disable-sudo: true
          disable-telemetry: true
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        run: docker buildx bake -f docker-build.hcl paperclip local-system-2 --load
      # With the launcher's flags (agents.zsh), so this is how users run them.
      - name: Smoke and security tests
        run: |
          mkdir -p "$RUNNER_TEMP/agents"
          run() {
            docker run --rm --read-only --tmpfs /tmp:exec --tmpfs /home:uid=1000,gid=1000 \
              --cap-drop ALL --security-opt no-new-privileges:true \
              -v "$RUNNER_TEMP/agents:/.agents:ro" \
              --entrypoint /sbin/tini willfarrell/paperclip -- home-init "$@"
          }
          for bin in claude codex copilot gemini opencode pi hermes herdr; do
            run "$bin" --version >/dev/null || { echo "::error::$bin does not start"; exit 1; }
          done
          test "$(run id -u)" = 1000 || { echo "::error::not uid 1000"; exit 1; }
          suid=$(run sh -c 'find / -xdev -perm /6000 -type f 2>/dev/null || true')
          test -z "$suid" || { echo "::error::setuid/setgid files: $suid"; exit 1; }
          test "$(run readlink /home/.claude/settings.json)" = /.agents/settings.claude.json \
            || { echo "::error::settings.json is not linked to read-only /.agents"; exit 1; }
          # home-init scrub: what a session plants in the home volume is gone at the next start.
          docker run --rm -v smoke-home:/home --entrypoint sh willfarrell/paperclip \
            -c 'mkdir -p /home/.claude/rules && touch /home/.bashrc /home/.claude/rules/x'
          docker run --rm -v smoke-home:/home --entrypoint /sbin/tini willfarrell/paperclip -- \
            home-init sh -c 'test ! -e /home/.bashrc && test ! -e /home/.claude/rules' \
            || { echo "::error::home-init left planted files"; exit 1; }
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint ollama willfarrell/local-system-2 --version >/dev/null \
            || { echo "::error::local-system-2 does not start"; exit 1; }
      # DAST: paperclip as compose runs it, scanned by the ZAP baseline. -I: warnings
      # are reported, not fatal; only rules ZAP itself marks FAIL break the build.
      - name: DAST (ZAP baseline, paperclip)
        env:
          PAPERCLIP_WORKSPACES: ${{ runner.temp }}/workspaces
        run: |
          mkdir -p "$HOME/.agents" "$PAPERCLIP_WORKSPACES" "$RUNNER_TEMP/zap"
          chmod 777 "$RUNNER_TEMP/zap"
          docker compose -f compose.yaml up -d --wait --wait-timeout 300 paperclip
          curl -sf --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null http://127.0.0.1:3100/
          docker build -q -t zap .github/zap
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" zap \
            zap-baseline.py -t http://127.0.0.1:3100 -I -r zap-report.html
      - name: Paperclip logs
        if: failure()
        run: docker compose -f compose.yaml logs paperclip paperclip-db
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: ${{ runner.temp }}/zap/zap-report.html
          retention-days: 14
          if-no-files-found: ignore
      # paperclip is herdr (every harness on tools) plus paperclip, so it and local-system-2 cover every image.
      - name: Trivy (paperclip)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: willfarrell/paperclip:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          hide-progress: true
          exit-code: 1
      - name: Trivy (local-system-2)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: willfarrell/local-system-2:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          hide-progress: true
          exit-code: 1
      - name: Trivy licensing (paperclip)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: willfarrell/paperclip:latest
          scanners: license
          hide-progress: true
          exit-code: 0
          format: table
      - name: Trivy licensing (local-system-2)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: willfarrell/local-system-2:latest
          scanners: license
          hide-progress: true
          exit-code: 0
          format: table

  # https://github.com/github/codeql-action
  codeql:
    name: "CodeQL: SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: actions
          queries: +security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:actions"

  # https://semgrep.dev/docs/semgrep-ci/sample-ci-configs/#github-actions
  # A plain runner job, not `container:`, so harden-runner can wrap it.
  semgrep:
    name: "semgrep: SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            auth.docker.io:443
            github.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            semgrep.dev:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        run: |
          docker build -q -t semgrep .github/semgrep
          docker run --rm -v "$PWD:/src:ro" -w /src semgrep \
            semgrep scan --config p/dockerfile --error --metrics=off .

  # https://github.com/raven-actions/actionlint
  actionlint:
    name: "actionlint: GitHub Actions lint"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          pyflakes: false

  # https://github.com/zizmorcore/zizmor-action
  zizmor:
    name: "zizmor: GitHub Actions SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  # https://github.com/trufflesecurity/trufflehog
  trufflehog:
    name: "TruffleHog: secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # audit: verification calls each secret's issuing provider, so egress is data-dependent.
          egress-policy: audit
          disable-sudo: true
          disable-telemetry: true
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@64d939a56362f519781c53ea09b27f8d1dc0140a # v3.97.6
        with:
          extra_args: --only-verified

  # https://github.com/gitleaks/gitleaks-action
  gitleaks:
    name: "gitleaks: secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            api.keygen.sh:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - name: Require GITLEAKS_LICENSE
        if: env.GITLEAKS_LICENSE == '' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
        run: |
          echo "::error::GITLEAKS_LICENSE secret is not set; gitleaks cannot run"
          exit 1
      - name: Checkout repository
        if: env.GITLEAKS_LICENSE != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
